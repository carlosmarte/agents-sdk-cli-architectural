[project]
name = "llmorch-adapter-local"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["llmorch-core", "openai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmorch_adapter_local"]

[tool.uv.sources]
llmorch-core = { workspace = true }
