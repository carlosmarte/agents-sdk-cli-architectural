[project]
name = "llmorch-cli"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["llmorch-sdk", "llmorch-core", "typer"]

[project.scripts]
llmorch = "llmorch_cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmorch_cli"]

[tool.uv.sources]
llmorch-sdk = { workspace = true }
llmorch-core = { workspace = true }
