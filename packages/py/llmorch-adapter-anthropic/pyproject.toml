[project]
name = "llmorch-adapter-anthropic"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["llmorch-core", "anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmorch_adapter_anthropic"]

[tool.uv.sources]
llmorch-core = { workspace = true }
