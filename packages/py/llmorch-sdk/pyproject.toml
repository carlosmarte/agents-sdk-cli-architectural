[project]
name = "llmorch-sdk"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "llmorch-core",
    "llmorch-adapter-openai",
    "llmorch-adapter-anthropic",
    "llmorch-adapter-gemini",
    "llmorch-adapter-copilot",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmorch_sdk"]

[tool.uv.sources]
llmorch-core = { workspace = true }
llmorch-adapter-openai = { workspace = true }
llmorch-adapter-anthropic = { workspace = true }
llmorch-adapter-gemini = { workspace = true }
llmorch-adapter-copilot = { workspace = true }
